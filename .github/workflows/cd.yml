name: CD - Deploy to EC2

on:
  push:
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/LibSync-0.0.1-SNAPSHOT.jar"
          target: "/opt/libsync"
          strip_components: 1

      - name: Restart application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e

            sudo mv /opt/libsync/LibSync-0.0.1-SNAPSHOT.jar /opt/libsync/app.jar

            sudo systemctl daemon-reload
            sudo systemctl restart libsync

            sleep 15

            if sudo systemctl is-active --quiet libsync; then
              echo "Application deployed successfully"
              sudo systemctl status libsync --no-pager
            else
              echo "Application failed to start"
              sudo journalctl -u libsync -n 50 --no-pager
              exit 1
            fi