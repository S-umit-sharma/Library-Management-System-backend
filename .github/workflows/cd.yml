name: CD - Deploy to EC2

on:
  workflow_run:
    workflows:
      - "CI - Build Test and Docker"
    types:
      - completed
    branches:
      - master

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Deploy Docker container to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: DB_URL,DB_USERNAME,DB_PASSWORD

          script: |
            set -e

            echo "Pulling latest Docker image..."

            sudo docker pull sumtsharma/libsync:latest

            echo "Stopping old container..."

            sudo docker stop libsync || true

            echo "Removing old container..."

            sudo docker rm libsync || true

            echo "Starting new container..."

            sudo docker run -d \
              --name libsync \
              --restart unless-stopped \
              -p 8080:8080 \
              -e DB_URL="$DB_URL" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              sumtsharma/libsync:latest

            echo "Waiting for application to start..."

            sleep 20

            echo "Checking container..."

            if sudo docker ps --filter "name=libsync" --filter "status=running" | grep -q libsync; then
              echo "Container is running successfully"
            else
              echo "Container failed to start"
              sudo docker logs --tail 100 libsync
              exit 1
            fi

            echo "Deployment completed successfully"

            sudo docker ps